<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stream Scraper{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div id="downloadStatus" class="global-download hidden">
        <div class="global-download__info">
            <strong id="statusTitle">Kein aktiver Download</strong>
            <span id="statusMessage">-</span>
        </div>
        <div class="global-download__progress">
            <div id="statusProgress" style="width: 0%;">0%</div>
        </div>
        <div class="global-download__meta">
            <span>Episoden: <span id="statusEpisode">-</span>/<span id="statusTotalEpisodes">-</span></span>
            <button id="cancelDownloadBtn" type="button" style="display: none;">Abbrechen</button>
        </div>
    </div>
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container app-navbar__inner">
            <a class="navbar-brand" href="/" aria-label="ScaP Startseite">
                <span class="brand-mark"><i class="bi bi-play-fill"></i></span>
                <span><strong>ScaP</strong><small>Stream Control</small></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-grid me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/library"><i class="bi bi-collection-play me-1"></i> Bibliothek</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-sliders me-1"></i> Einstellungen
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="/settings">Allgemein</a></li>
                            <li><a class="dropdown-item" href="/gemini">Gemini API</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/about">Über</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="nav-search ms-auto" action="/search" method="get">
                    <i class="bi bi-search"></i>
                    <input class="form-control" type="search" name="q" placeholder="Medien durchsuchen" aria-label="Medien durchsuchen">
                </form>
            </div>
        </div>
    </nav>

    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.5.4/dist/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
